<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet</title>

    <link rel="stylesheet" href="./frontend/css/home.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>

    <div class="overlay"></div>

    <div class="container-header">

        <a href="./frontend/pages/perfil.html" class="btn-perfil">
            <i class="fa-solid fa-user"></i>
            Meu Perfil
        </a>

    </div>

</header>

<section class="filtros">

    <div class="campo">

        <label>Buscar clínicas</label>

        <input
            type="text"
            id="pesquisa"
            placeholder="Digite o nome da clínica..."
        >

    </div>

    <div class="campo">

        <label>Selecione sua região</label>

        <select id="regiao">

            <option value="todas">
                Todas as regiões
            </option>

            <option value="Centro">
                Centro
            </option>

            <option value="Cambuí">
                Cambuí
            </option>

            <option value="Taquaral">
                Taquaral
            </option>

            <option value="Barão Geraldo">
                Barão Geraldo
            </option>

        </select>

    </div>

</section>

<section class="clinicas" id="listaClinicas"></section>

<script src="./frontend/js/home.js"></script>

</body>

</html>
