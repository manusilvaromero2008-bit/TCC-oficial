<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta</title>

    <link rel="stylesheet" href="../css/dataehorario.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Agendar Consulta</h1>
            <p id="nomeClinica"></p>
        </header>

        <div class="etapas">

            <div class="etapa ativa">
                <div class="numero">1</div>
                <span>Data e Hora</span>
            </div>

            <div class="linha"></div>

            <div class="etapa">
                <div class="numero">2</div>
                <span>Serviço</span>
            </div>

            <div class="linha"></div>

            <div class="etapa">
                <div class="numero">3</div>
                <span>Pet e Transporte</span>
            </div>

        </div>

        <div class="card">

            <h2>
                <i class="fa-regular fa-calendar"></i>
                Selecione a Data
            </h2>

            <div class="datas">

                <button type="button">quinta-feira, 28 de maio</button>
                <button type="button">sexta-feira, 29 de maio</button>
                <button type="button">segunda-feira, 01 de junho</button>
                <button type="button">terça-feira, 02 de junho</button>
                <button type="button">quarta-feira, 03 de junho</button>
                <button type="button">quinta-feira, 04 de junho</button>
                <button type="button">sexta-feira, 05 de junho</button>

            </div>

        </div>

        <div class="card" id="cardHorario">

            <h2>
                <i class="fa-regular fa-clock"></i>
                Selecione o Horário
            </h2>

            <div class="horarios">

                <button type="button">08:00</button>
                <button type="button">08:30</button>
                <button type="button">09:00</button>
                <button type="button">09:30</button>
                <button type="button">10:00</button>
                <button type="button">10:30</button>
                <button type="button">11:00</button>
                <button type="button">11:30</button>
                <button type="button">14:00</button>
                <button type="button">14:30</button>
                <button type="button">15:00</button>
                <button type="button">15:30</button>
                <button type="button">16:00</button>
                <button type="button">16:30</button>
                <button type="button">17:00</button>
                <button type="button">17:30</button>

            </div>

        </div>

        <button class="continuar" id="btnContinuar" type="button">
            Continuar
        </button>

    </div>

    <script src="../js/dataehorario.js"></script>

</body>

</html>
