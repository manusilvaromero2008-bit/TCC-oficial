<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agenda Pet</title>

    <link rel="stylesheet" href="../css/cadastro.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <header class="cadastro-header">

        <a href="../../home.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar
        </a>

        <h1>
            <i class="fa-solid fa-paw"></i>
            Cadastro para Agendamento
        </h1>

        <p>Preencha os dados do tutor e do(s) pet(s).</p>

    </header>

    <main class="container">

        <form>

            <!-- DADOS DO TUTOR -->

            <section class="box">

                <h2>
                    <i class="fa-solid fa-user"></i>
                    Dados do Tutor
                </h2>

                <div class="grid">

                    <div class="campo">
                        <label>Nome Completo *</label>
                        <input type="text" id="nomeTutor" placeholder="Digite seu nome" required>
                    </div>

                    <div class="campo">
                        <label>CPF *</label>
                        <input type="text" id="cpfTutor" placeholder="000.000.000-00" required>
                    </div>

                    <div class="campo">
                        <label>Telefone *</label>
                        <input type="tel" id="telefoneTutor" placeholder="(19) 99999-9999" required>
                    </div>

                    <div class="campo">
                        <label>E-mail *</label>
                        <input type="email" id="emailTutor" placeholder="email@email.com" required>
                    </div>

                    <div class="campo full">
                        <label>Endereço *</label>
                        <input type="text" id="enderecoTutor" placeholder="Rua, número e bairro" required>
                        <label> CEP </label>
                        <input type="text" id="cep" placeholder="Digite o CEP"
                    </div>

                </div>

            </section>

            

            <section class="box">

                <h2>
                    <i class="fa-solid fa-dog"></i>
                    Dados do(s) Pet(s)
                </h2>

                <div id="pets">

                    <div class="pet">

                        <h3>
                            <i class="fa-solid fa-paw"></i>
                            Pet 1
                        </h3>

                        <div class="grid">

                            <div class="campo">
                                <label>Nome *</label>
                                <input type="text" id="nomePet" class="nomePet" placeholder="Nome do pet" required>
                            </div>

                            <div class="campo">
                                <label>Espécie *</label>

                                <select id="especiePet" class="especiePet" required>
                                    <option>Cão</option>
                                    <option>Gato</option>
                                    <option>Ave</option>
                                    <option>Roedor</option>
                                    <option>Outro</option>
                                </select>

                            </div>

                            <div class="campo">
                                <label>Raça *</label>
                                <input type="text" id="racaPet" class="racaPet" placeholder="Raça" required>
                            </div>

                            <div class="campo">
                                <label>Idade *</label>
                                <input type="text" id="idadePet" class="idadePet" placeholder="Ex: 2 anos" required>
                            </div>

                            <div class="campo">
                                <label>Sexo *</label>

                                <select id="sexoPet" class="sexoPet" required>
                                    <option>Macho</option>
                                    <option>Fêmea</option>
                                </select>

                            </div>

                            <div class="campo">
                                <label>Peso *</label>
                                <input type="text" id="pesoPet" class="pesoPet" placeholder="Ex: 5 kg" required>
                            </div>

                        </div>

                    </div>

                </div>

                <button type="button" id="adicionarPet" class="btn-add">

                    <i class="fa-solid fa-plus"></i>

                    Adicionar outro pet

                </button>

            </section>

            <button type="button" id="btnProsseguir" class="btn-confirmar">

                Prosseguir para Agendamento

            </button>

        </form>

    </main>

    <script src="../js/cadastro.js"></script>

</body>

</html>
