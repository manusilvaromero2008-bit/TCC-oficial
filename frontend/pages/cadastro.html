<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Agenda Pet</title>

    <link rel="stylesheet" href="../css/cadastro.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="cadastro-header">

    <a href="perfil.html" class="voltar">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
    </a>

    <h1>
        <i class="fa-solid fa-paw"></i>
        Meu Cadastro
    </h1>

    <p>
        Cadastre seus dados e os dados dos seus pets.
    </p>

</header>


<main class="container">

    <form id="formCadastro">

        <section class="box">

            <h2>
                <i class="fa-solid fa-user"></i>
                Dados do Tutor
            </h2>

            <div class="grid">

                <div class="campo">

                    <label for="nomeTutor">
                        Nome Completo *
                    </label>

                    <input
                        type="text"
                        id="nomeTutor"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cpfTutor">
                        CPF *
                    </label>

                    <input
                        type="text"
                        id="cpfTutor"
                        placeholder="000.000.000-00"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefoneTutor">
                        Telefone *
                    </label>

                    <input
                        type="tel"
                        id="telefoneTutor"
                        placeholder="(19) 99999-9999"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="emailTutor">
                        E-mail *
                    </label>

                    <input
                        type="email"
                        id="emailTutor"
                        placeholder="email@email.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="enderecoTutor">
                        Endereço *
                    </label>

                    <input
                        type="text"
                        id="enderecoTutor"
                        placeholder="Rua, número e bairro"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cep">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        placeholder="Digite o CEP"
                    >

                </div>

            </div>

        </section>


        <section class="box">

            <h2>
                <i class="fa-solid fa-dog"></i>
                Meus Pets
            </h2>

            <div id="pets">

                <div class="pet">

                    <h3>
                        <i class="fa-solid fa-paw"></i>
                        Pet 1
                    </h3>

                    <div class="grid">

                        <div class="campo">

                            <label>
                                Nome *
                            </label>

                            <input
                                type="text"
                                class="nomePet"
                                placeholder="Nome do pet"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Espécie *
                            </label>

                            <select
                                class="especiePet"
                                required
                            >

                                <option value="Cão">
                                    Cão
                                </option>

                                <option value="Gato">
                                    Gato
                                </option>

                                <option value="Ave">
                                    Ave
                                </option>

                                <option value="Roedor">
                                    Roedor
                                </option>

                                <option value="Outro">
                                    Outro
                                </option>

                            </select>

                        </div>


                        <div class="campo">

                            <label>
                                Raça *
                            </label>

                            <input
                                type="text"
                                class="racaPet"
                                placeholder="Raça"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Idade *
                            </label>

                            <input
                                type="text"
                                class="idadePet"
                                placeholder="Ex: 2 anos"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Sexo *
                            </label>

                            <select
                                class="sexoPet"
                                required
                            >

                                <option value="Macho">
                                    Macho
                                </option>

                                <option value="Fêmea">
                                    Fêmea
                                </option>

                            </select>

                        </div>


                        <div class="campo">

                            <label>
                                Peso *
                            </label>

                            <input
                                type="text"
                                class="pesoPet"
                                placeholder="Ex: 5 kg"
                                required
                            >

                        </div>

                    </div>

                </div>

            </div>


            <button
                type="button"
                id="adicionarPet"
                class="btn-add"
            >

                <i class="fa-solid fa-plus"></i>

                Adicionar outro pet

            </button>

        </section>


        <button
            type="button"
            id="btnProsseguir"
            class="btn-confirmar"
        >

            <i class="fa-solid fa-check"></i>

            Salvar cadastro

        </button>

    </form>

</main>


<script src="../js/cadastro.js"></script>

</body>

</html>
