<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <header class="cadastro-header">
        <a href="../../home.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>Voltar
        </a>

        <h1>
            <i class="fa-solid fa-paw"></i>
            Cadastro para Agendamento
        </h1>
        <p>Preencha os dados do tutor e do pet para continuar.</p>

    </header>

    <div class="container">
        <form>
            <section class="box">
                <h2>
                    <i class="fa-solid fa-user"></i>
                    Dados do Tutor
                </h2>

                <div class="campo">
                    <label>Nome Completo</label>
                    <input type="text" required>
                </div>

                <div class="campo">
                    <label>CPF</label>
                    <input type="text" required>
                </div>

                <div class="campo">
                    <label>Telefone</label>
                    <input type="tel" required>
                </div>

                <div class="campo">
                    <label>Email</label>
                    <input type="email" required>
                </div>

            </section>

            <section class="box">
                <h2>
                    <i class="fa-solid fa-dog"></i>
                    Dados do Pet
                </h2>

                <div class="campo">
                    <label>Nome do Pet</label>
                    <input type="text" required>
                </div>
                <div class="campo">
                    <label>Espécie</label>
                    <select required>
                        <option>Cachorro</option>
                        <option>Gato</option>
                        <option>Ave</option>
                        <option>Roedor</option>
                        <option>Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Raça</label>
                    <input type="text">
                </div>

                <div class="campo">
                    <label>Idade</label>
                    <input type="number">
                </div>

                <div class="campo">
                    <label>Sexo</label>
                    <select>
                        <option>Macho</option>
                        <option>Fêmea</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Peso (kg)</label>
                    <input type="number" step="0.1">
                </div>

            </section>

            <button class="btn-confirmar">
                Prosseguir para Agendamento
            </button>
        </form>
    </div>
    
</body>
</html>
