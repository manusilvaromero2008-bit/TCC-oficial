
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agenda Pet</title>

    <link
        rel="stylesheet"
        href="../css/home.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>

<body>

<header>

    <div class="overlay"></div>

    <div class="container-header">

        <div class="botoes-header">

            <a
                href="../pages/animais.html"
                class="btn-perdidos"
            >
                <i class="fa-solid fa-paw"></i>
                S.O.S ANIMAIS
            </a>

            <a
                href="../pages/perfil.html"
                class="btn-perfil"
            >
                <i class="fa-solid fa-user"></i>
                Meu Perfil
            </a>

        </div>

    </div>

</header>


<section class="filtros">

    <div class="campo">

        <label for="pesquisa">
            Buscar clínicas
        </label>

        <input
            type="text"
            id="pesquisa"
            placeholder="Digite o nome da clínica..."
        >

    </div>


    <div class="campo">

        <label for="regiao">
            Selecione sua região
        </label>

        <select id="regiao">

            <option value="todas">
                Todas as regiões
            </option>

            <option value="Centro">
                Centro
            </option>

            <option value="Cambuí">
                Cambuí
            </option>

            <option value="Taquaral">
                Taquaral
            </option>

            <option value="Barão Geraldo">
                Barão Geraldo
            </option>

        </select>

    </div>

</section>


<section class="mapa-container">

    <h2>Encontre uma clínica</h2>

    <div id="map"></div>

</section>


<section
    class="clinicas"
    id="listaClinicas"
>

    <p class="mensagem-carregando">
        Carregando clínicas...
    </p>

</section>


    <a
        href="https://www.google.com/maps/dir/?api=1&destination=Clinica+Veterinaria+de+Cambui,+Campinas,+SP"
        target="_blank"
        class="btn-rota"
    >
        <i class="fa-solid fa-location-dot"></i>
        Como chegar
    </a>

</section>


<script src="../js/home.js"></script>

<script src="../js/maps.js"></script>

<script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCHi8rNqtgX0wOwly6iuvU1B1zVxjxaWXQ&callback=initMap"
    async
    defer
></script>

</body>

</html>
